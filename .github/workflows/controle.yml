# Automatische controle van de site.
# - Bij elke push en pull request: build, formuliertests en de SEO-/linkcontrole (npm run controle).
# - Elke 1e van de maand: ook de externe bronlinks in de gidsen. Faalt die, dan krijgt u een e-mail van GitHub.
name: Controle

on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run controle
      - name: Externe links (alleen maandelijks of met de hand)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run links:extern
